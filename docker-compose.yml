# Sistema de Gestão de Patrimônio — SMS Joinville
# Orquestra os três containers descritos no RFC (seção 5.4):
# API REST, frontend e PostgreSQL, mais Prometheus/Grafana (seção 5.5.4).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgp}
      POSTGRES_DB: ${POSTGRES_DB:-sgp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sgp}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgp}:${POSTGRES_PASSWORD:-sgp}@db:5432/${POSTGRES_DB:-sgp}?schema=public
      API_PORT: 3333
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SGP <sgp@joinville.sc.gov.br>}
    volumes:
      - api-uploads:/app/uploads
    ports:
      # Só a própria máquina acessa a API direto; o acesso normal passa pelo Nginx (/api)
      - '127.0.0.1:3333:3333'

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    # Histórico das métricas: sobrevive a recriações do container; o Prometheus apaga o que passar da retenção
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    profiles: ['observability']

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    # O acesso normal é por /grafana/ no Nginx; a porta local serve para túnel SSH e testes
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Servido pelo Nginx em /grafana/; GRAFANA_URL é o endereço público completo (ex.: https://sgp.yomlabs.io/grafana/)
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:${WEB_PORT:-8080}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    # Sem senha padrão: o Grafana só sobe se GRAFANA_PASSWORD estiver definida. Não usamos `:?` porque
    # o Compose valida a variável mesmo com o profile desligado e quebraria o deploy normal.
    entrypoint:
      - /bin/sh
      - -c
      - 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "Defina GRAFANA_PASSWORD no .env" >&2; exit 1; }; exec /run.sh'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ['observability']

volumes:
  pgdata:
  grafana-data:
  prometheus-data:
  api-uploads:
