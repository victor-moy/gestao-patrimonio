server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sem isso o nginx corta em 1m por padrão, abaixo do maior limite de
  # upload da API (laudo de manutenção, 10MB) — o cliente recebia 413 antes
  # da requisição sequer chegar no Node.
  client_max_body_size 10m;

  # SPA — todas as rotas caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy da API para o container da API REST
  location /api/ {
    proxy_pass http://api:3333/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
