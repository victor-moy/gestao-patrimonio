server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Sem isso o nginx corta em 1m por padrão, abaixo do maior limite de
  # upload da API (laudo de manutenção, 10MB) — o cliente recebia 413 antes
  # da requisição sequer chegar no Node.
  client_max_body_size 10m;

  # Arquivos com hash no nome nunca mudam: cache longo
  location /assets/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # O index.html referencia os arquivos novos a cada versão: nunca fica em cache
  location = /index.html {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }

  # SPA — todas as rotas caem no index.html
  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Métricas do Prometheus são só para a rede interna (a coleta acessa api:3333 direto)
  location = /api/metrics {
    return 404;
  }

  # Proxy da API para o container da API REST
  # (a API já envia os próprios cabeçalhos de segurança via helmet)
  location /api/ {
    proxy_pass http://api:3333/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
