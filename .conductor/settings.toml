"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci --prefix backend && npm --prefix backend run prisma:generate && npm ci --prefix frontend"
run_mode = "concurrent"

[scripts.run.verify]
command = "npm --prefix backend run lint && npm --prefix backend run build && npm --prefix backend run test:coverage && npm --prefix frontend run lint && npm --prefix frontend run build && npm --prefix frontend run test:coverage"
default = true
icon = "badge-check"

[scripts.run.test-backend]
command = "npm --prefix backend run test:coverage"
icon = "test-tube"

[scripts.run.test-frontend]
command = "npm --prefix frontend run test:coverage"
icon = "test-tube"

[scripts.run.audit-production]
command = "npm --prefix backend audit --omit=dev && npm --prefix frontend audit --omit=dev"
icon = "shield-check"
